name: 🚀 Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Eazzio Mail
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 8m
          script: |
            export PATH="/home/ubuntu/.local/share/pnpm:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"
            bash /home/ubuntu/Eazzio_Mail/scripts/deploy.sh
